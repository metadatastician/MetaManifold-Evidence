name: Proofs and tests

# Same recipe as residual-evidence-types: Debian's agda package at an exact
# version inside a digest-pinned image, dependencies fetched by commit with
# plain git, and only a GitHub-owned action, pinned by SHA.

on:
  push:
    # The evidence branch itself must be green before its PR is opened or
    # updated, not only after a workflow_dispatch or a main-branch push.
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proofs:
    name: Counts proofs, expected rejections and mutants
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: debian:13-slim@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132
    steps:
      - name: Install authenticated Debian toolchain packages
        run: |
          apt-get update
          apt-get install --no-install-recommends -y ca-certificates git agda-bin=2.6.4.3-1+b2
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Verify the checked Agda version
        run: test "$(agda --version)" = 'Agda version 2.6.4.3'
      - name: Fetch residual-evidence-types by commit
        run: bash scripts/fetch-layer-a.sh
      - name: Counts proofs, axiom audit and expected rejections
        run: bash scripts/check.sh
      - name: Gate self-test (every mutant must be refused)
        run: bash scripts/mutants.sh

  rocq:
    # PROOF-POLICY §2 recheck leg, re-proved by hand. Rocq comes from
    # Ubuntu's package index at an exact version, not a Guix manifest or
    # container: a §6 deviation, recorded in PROOF-STATUS.adoc.
    name: Rocq recheck leg
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install Rocq from Ubuntu at an exact version
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y coq=8.18.0+dfsg-1build2
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Fetch residual-evidence-types by commit
        run: bash scripts/fetch-layer-a.sh
      - name: Rocq leg, assumptions audit and expected rejections
        run: bash scripts/check-rocq.sh

  lean:
    # PROOF-POLICY §2 recheck leg, re-proved by hand with core Init only.
    # The release tarball is checked against a recorded sha256: a §6
    # deviation, recorded in PROOF-STATUS.adoc.
    name: Lean recheck leg
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LEAN_VERSION: 4.24.0
      LEAN_SHA256: b14f5e5159219dd1a1956c3b806813319f5e94ccd5bdfd56f54520609a5bb5ec
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install checksum-verified Lean
        run: |
          curl -fsSLo lean.tar.zst "https://github.com/leanprover/lean4/releases/download/v${LEAN_VERSION}/lean-${LEAN_VERSION}-linux.tar.zst"
          echo "${LEAN_SHA256}  lean.tar.zst" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/lean"
          tar --use-compress-program=unzstd -xf lean.tar.zst -C "$RUNNER_TEMP/lean" --strip-components=1
          rm lean.tar.zst
          echo "LEAN=$RUNNER_TEMP/lean/bin/lean" >> "$GITHUB_ENV"
      - name: Fetch residual-evidence-types by commit
        run: bash scripts/fetch-layer-a.sh
      - name: Lean leg, axiom audit and expected rejections
        run: bash scripts/check-lean.sh

  julia:
    # The official tarball, checked against the sha256 julialang publishes,
    # instead of a third-party setup action.
    name: Julia tests and grid certificate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      JULIA_VERSION: 1.12.6
      JULIA_SHA256: bbabf3bef19421a9dbd24a767d807606ab85e444323b5a1c73ffe293fa3d079a
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install checksum-verified Julia
        run: |
          curl -fsSLo julia.tar.gz "https://julialang-s3.julialang.org/bin/linux/x64/1.12/julia-${JULIA_VERSION}-linux-x86_64.tar.gz"
          echo "${JULIA_SHA256}  julia.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/julia"
          tar -xzf julia.tar.gz -C "$RUNNER_TEMP/julia" --strip-components=1
          rm julia.tar.gz
          echo "$RUNNER_TEMP/julia/bin" >> "$GITHUB_PATH"
      - name: Verify the Julia version
        run: test "$(julia --version)" = "julia version ${JULIA_VERSION}"
      - name: Package tests
        run: julia --project=julia -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
      - name: Grid certificate gate self-test (table current, every mutant must change it)
        run: bash scripts/julia-mutants.sh

  pr68-handoff:
    # Strict gate on the WebUI handoff artifacts: REUSE/SPDX headers, the
    # index, the pinned upstream commit, a real `git apply --check` and
    # `git am` against that commit, the exact four touched files, the presence
    # of the production fix and its regression, and a token-level Julia
    # structure delta of zero. This is the most specific check possible in
    # this repository: WebUI's own Julia/Agda/SSH suites run in WebUI CI on
    # the applied head, not here.
    name: "PR #68 handoff patch integrity"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install Python tooling for the Julia structure check
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ca-certificates git python3-pip
      - name: Verify the handoff patch, its notes and the Julia structure
        run: bash scripts/check-pr68-handoff.sh
